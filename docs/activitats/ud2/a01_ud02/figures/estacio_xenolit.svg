<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc">
<title id="title">Xenòlit: com podem obtenir roques de zones on no podem arribar?</title>
<desc id="desc">Infografia educativa sobre els xenòlits, fragments de roca transportats pel magma cap a la superfície, amb informació sobre què obtenim, què inferim i les limitacions.</desc>
<rect width="1400" height="1000" fill="#ffffff"/>
<rect x="45" y="35" width="1310" height="115" rx="24" fill="#fff0d6"/>
<text x="70" y="105" font-family="Arial, sans-serif" font-size="62" font-weight="700" fill="#102a43">XENÒLIT</text>
<text x="425" y="100" font-family="Arial, sans-serif" font-size="31" font-weight="600" fill="#334e68">Com podem obtenir roques de zones on no podem arribar?</text>

<rect x="50" y="185" width="760" height="610" rx="26" fill="#eef7ff" stroke="#2680b9" stroke-width="3"/>
<text x="80" y="235" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#116799">Com arriba fins a nosaltres?</text>
<rect x="85" y="275" width="690" height="470" rx="18" fill="#f7fbff"/>
<rect x="85" y="275" width="690" height="110" fill="#d8c3a5"/>
<rect x="85" y="385" width="690" height="155" fill="#c49a6c"/>
<rect x="85" y="540" width="690" height="205" fill="#a76b3f"/>
<text x="105" y="320" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#243b53">Superfície</text>
<text x="105" y="440" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#243b53">Escorça</text>
<text x="105" y="620" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">Mantell superior</text>
<path d="M430 720 C390 640,470 585,430 515 C390 450,475 400,445 330 C430 295,450 270,470 250 L555 250 C525 300,540 345,575 395 C615 455,540 520,575 585 C615 655,535 705,555 745 Z" fill="#f36c21" opacity="0.95"/>
<path d="M485 690 L485 320" stroke="#ffffff" stroke-width="8" marker-end="url(#arr)"/>
<defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#ffffff"/></marker></defs>
<g fill="#3d3d3d" stroke="#ffffff" stroke-width="2">
<polygon points="430,650 455,630 482,648 465,680 437,676"/>
<polygon points="510,575 535,553 562,570 552,604 520,610"/>
<polygon points="440,500 467,480 493,497 481,527 449,532"/>
<polygon points="520,420 548,405 570,425 558,452 530,458"/>
<polygon points="455,345 482,332 504,350 496,378 466,382"/>
</g>
<text x="590" y="355" font-family="Arial, sans-serif" font-size="24" fill="#243b53">1. El magma ascendeix.</text>
<text x="590" y="410" font-family="Arial, sans-serif" font-size="24" fill="#243b53">2. Arrenca fragments de roca.</text>
<text x="590" y="465" font-family="Arial, sans-serif" font-size="24" fill="#243b53">3. Els transporta cap amunt.</text>
<text x="590" y="520" font-family="Arial, sans-serif" font-size="24" fill="#243b53">4. Alguns arriben a la superfície.</text>
<text x="115" y="785" font-family="Arial, sans-serif" font-size="24" fill="#486581">Un xenòlit és un fragment real de roca transportat pel magma.</text>

<rect x="850" y="185" width="500" height="235" rx="24" fill="#f3faef" stroke="#66a85c" stroke-width="3"/>
<text x="880" y="235" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#3d7b35">Què obtenim directament?</text>
<circle cx="890" cy="290" r="12" fill="#66a85c"/><text x="925" y="300" font-family="Arial, sans-serif" font-size="24" fill="#243b53">Un fragment real de roca</text>
<circle cx="890" cy="340" r="12" fill="#66a85c"/><text x="925" y="350" font-family="Arial, sans-serif" font-size="24" fill="#243b53">Els minerals que el formen</text>
<circle cx="890" cy="390" r="12" fill="#66a85c"/><text x="925" y="400" font-family="Arial, sans-serif" font-size="24" fill="#243b53">Composició, textura i propietats</text>

<rect x="850" y="445" width="500" height="205" rx="24" fill="#eef7ff" stroke="#2680b9" stroke-width="3"/>
<text x="880" y="495" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#116799">Què podem inferir?</text>
<text x="880" y="550" font-family="Arial, sans-serif" font-size="24" fill="#243b53">• Materials presents a la zona d'origen</text>
<text x="880" y="590" font-family="Arial, sans-serif" font-size="24" fill="#243b53">• Condicions en què s'ha format o modificat</text>
<text x="880" y="630" font-family="Arial, sans-serif" font-size="24" fill="#243b53">• Característiques de regions profundes</text>

<rect x="850" y="675" width="500" height="185" rx="24" fill="#fff0f0" stroke="#cc4b4b" stroke-width="3"/>
<text x="880" y="725" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#a52828">Quina és la limitació?</text>
<text x="880" y="775" font-family="Arial, sans-serif" font-size="23" fill="#243b53">La mostra ha estat transportada pel magma:</text>
<text x="880" y="810" font-family="Arial, sans-serif" font-size="23" fill="#243b53">hem d'inferir d'on prové i què representa.</text>
<text x="880" y="845" font-family="Arial, sans-serif" font-size="23" fill="#243b53">Pot haver estat modificada durant el transport.</text>

<rect x="50" y="835" width="760" height="120" rx="24" fill="#f3efff" stroke="#8a73c5" stroke-width="3"/>
<text x="80" y="885" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#463875">Idea clau</text>
<text x="80" y="925" font-family="Arial, sans-serif" font-size="25" fill="#243b53">Podem estudiar directament la mostra, però hem d'inferir d'on prové i què representa.</text>

<rect x="850" y="885" width="500" height="70" rx="20" fill="#fff9d9" stroke="#e0b522" stroke-width="3"/>
<text x="880" y="928" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#5c4b00">Pensa: què observam i què inferim?</text>
</svg>