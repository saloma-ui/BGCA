<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc">
<title id="title">Registre sísmic: com obtenim informació de llocs on no podem arribar?</title>
<desc id="desc">Infografia educativa sobre el registre sísmic com a font d'informació indirecta, des del terratrèmol fins al sismograma i les inferències sobre l'interior terrestre.</desc>
<rect width="1200" height="1500" fill="#ffffff"/>
<rect x="50" y="40" width="1100" height="120" rx="24" fill="#e8f3fb"/>
<text x="75" y="110" font-family="Arial, sans-serif" font-size="60" font-weight="700" fill="#102a43">REGISTRE SÍSMIC</text>
<text x="75" y="148" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#334e68">Com podem obtenir informació de llocs on no podem arribar?</text>

<rect x="55" y="205" width="670" height="760" rx="26" fill="#eef7ff" stroke="#2680b9" stroke-width="3"/>
<text x="85" y="255" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#116799">Com obtenim la dada?</text>
<rect x="95" y="300" width="590" height="610" rx="18" fill="#f7fbff"/>
<rect x="95" y="300" width="590" height="160" fill="#c6d7a6"/>
<rect x="95" y="460" width="590" height="450" fill="#d9a066"/>
<circle cx="230" cy="785" r="28" fill="#f39c12"/>
<g stroke="#f39c12" stroke-width="4" fill="none" opacity="0.75">
<circle cx="230" cy="785" r="60"/><circle cx="230" cy="785" r="105"/><circle cx="230" cy="785" r="150"/>
</g>
<path d="M245 760 C330 650, 420 555, 555 430" stroke="#d64545" stroke-width="7" fill="none"/>
<path d="M245 805 C340 720, 445 625, 590 430" stroke="#2d7fb8" stroke-width="7" fill="none"/>
<rect x="500" y="345" width="100" height="65" fill="#ffffff" stroke="#334e68" stroke-width="3"/>
<line x1="520" y1="375" x2="580" y2="375" stroke="#334e68" stroke-width="3"/>
<text x="465" y="335" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#243b53">Estació sísmica</text>
<text x="145" y="835" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#243b53">1. Es produeix un terratrèmol.</text>
<text x="145" y="875" font-family="Arial, sans-serif" font-size="23" fill="#243b53">2. Les ones es propaguen per l'interior.</text>
<text x="145" y="915" font-family="Arial, sans-serif" font-size="23" fill="#243b53">3. Arriben a una estació sísmica.</text>

<rect x="760" y="205" width="385" height="300" rx="24" fill="#f3faef" stroke="#66a85c" stroke-width="3"/>
<text x="790" y="255" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#3d7b35">Què mesuram directament?</text>
<text x="790" y="315" font-family="Arial, sans-serif" font-size="24" fill="#243b53">• Moviment del sòl</text>
<text x="790" y="360" font-family="Arial, sans-serif" font-size="24" fill="#243b53">• Moment d'arribada de les ones</text>
<text x="790" y="405" font-family="Arial, sans-serif" font-size="24" fill="#243b53">• Amplitud del senyal</text>
<text x="790" y="450" font-family="Arial, sans-serif" font-size="24" fill="#243b53">• Diferència d'arribada P–S</text>

<rect x="760" y="535" width="385" height="300" rx="24" fill="#eef7ff" stroke="#2680b9" stroke-width="3"/>
<text x="790" y="585" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#116799">Què podem inferir?</text>
<text x="790" y="640" font-family="Arial, sans-serif" font-size="23" fill="#243b53">• Canvis de propietats dels materials</text>
<text x="790" y="680" font-family="Arial, sans-serif" font-size="23" fill="#243b53">• Fronteres internes</text>
<text x="790" y="720" font-family="Arial, sans-serif" font-size="23" fill="#243b53">• Estat físic d'algunes regions</text>
<text x="790" y="760" font-family="Arial, sans-serif" font-size="23" fill="#243b53">• Variacions amb la profunditat</text>
<text x="790" y="805" font-family="Arial, sans-serif" font-size="21" fill="#486581">Aquestes conclusions no es veuen</text>
<text x="790" y="833" font-family="Arial, sans-serif" font-size="21" fill="#486581">directament: s'obtenen interpretant les dades.</text>

<rect x="760" y="865" width="385" height="250" rx="24" fill="#fff0f0" stroke="#cc4b4b" stroke-width="3"/>
<text x="790" y="915" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#a52828">Quina és la limitació?</text>
<text x="790" y="970" font-family="Arial, sans-serif" font-size="23" fill="#243b53">El sismograma no és una imatge</text>
<text x="790" y="1005" font-family="Arial, sans-serif" font-size="23" fill="#243b53">directa de l'interior terrestre.</text>
<text x="790" y="1050" font-family="Arial, sans-serif" font-size="23" fill="#243b53">Cal interpretar les dades i comparar</text>
<text x="790" y="1085" font-family="Arial, sans-serif" font-size="23" fill="#243b53">registres amb models de propagació.</text>

<rect x="55" y="1010" width="670" height="180" rx="24" fill="#f3efff" stroke="#8a73c5" stroke-width="3"/>
<text x="85" y="1060" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#463875">Idea clau</text>
<text x="85" y="1110" font-family="Arial, sans-serif" font-size="25" fill="#243b53">El sismògraf registra un efecte a la superfície.</text>
<text x="85" y="1150" font-family="Arial, sans-serif" font-size="25" fill="#243b53">A partir d'aquest efecte inferim propietats de l'interior.</text>

<rect x="55" y="1235" width="1090" height="175" rx="24" fill="#fff9d9" stroke="#e0b522" stroke-width="3"/>
<text x="85" y="1285" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#5c4b00">Pensa i respon</text>
<text x="90" y="1335" font-family="Arial, sans-serif" font-size="24" fill="#243b53">1. Què mesura directament un sismògraf?</text>
<text x="90" y="1375" font-family="Arial, sans-serif" font-size="24" fill="#243b53">2. Què podem arribar a inferir a partir del registre?</text>
<text x="90" y="1415" font-family="Arial, sans-serif" font-size="24" fill="#243b53">3. Quina diferència hi ha entre allò que mesuram i allò que concloem?</text>
</svg>