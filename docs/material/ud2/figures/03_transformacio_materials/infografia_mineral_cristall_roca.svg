<text x="72" y="1331" font-family="DejaVu Sans, Arial, sans-serif" font-size="31" font-weight="700" text-anchor="start" fill="#173658">IDEES CLAU</text>
<text x="76" y="1380" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#173658">• L’estructura cristal·lina descriu l’ordre intern dels àtoms.</text><text x="76" y="1423" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#173658">• La textura d’una roca descriu com s’organitzen els seus components.</text><text x="76" y="1466" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#173658">• Una mostra mineralògica pot incloure matriu rocosa i altres minerals.</text>
<text x="600" y="1512" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#173658">La composició per si sola no explica la història d’una roca.</text>
</svg>