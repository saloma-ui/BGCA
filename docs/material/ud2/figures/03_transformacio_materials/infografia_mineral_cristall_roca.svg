<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="ttl descr"><title id="ttl">Mineral, cristall i roca</title><desc id="descr">Infografia resum amb definicions i l'exemple comparat de calcita, calcària i marbre.</desc>
<rect x="0" y="0" width="1200" height="1600" rx="0" fill="#faf9f6" stroke="none" stroke-width="1"/>
<path d="M0 0 H1200 V155 H0 Z" fill="#e9f1f5"/>
<text x="600" y="74" font-family="DejaVu Sans, Arial, sans-serif" font-size="54" font-weight="700" text-anchor="middle" fill="#173658">MINERAL, CRISTALL I ROCA</text>
<text x="600" y="123" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#506577">Una mateixa espècie mineral pot formar materials diferents</text>
<rect x="35" y="180" width="350" height="480" rx="20" fill="#f2e2ca" stroke="#d4aa77" stroke-width="2"/>
<text x="210" y="237" font-family="DejaVu Sans, Arial, sans-serif" font-size="33" font-weight="700" text-anchor="middle" fill="#173658">MINERAL</text>
<text x="60" y="292" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#173658">Substància sòlida natural,</text><text x="60" y="328" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#173658">generalment inorgànica,</text><text x="60" y="364" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#173658">amb una composició química</text><text x="60" y="400" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#173658">definida dins uns límits i</text><text x="60" y="436" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#173658">estructura cristal·lina.</text>
<text x="60" y="624" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="600" text-anchor="start" fill="#506577">Exemples: calcita, quars, halita.</text>
<rect x="425" y="180" width="350" height="480" rx="20" fill="#dbeefa" stroke="#75b7d5" stroke-width="2"/>
<text x="600" y="237" font-family="DejaVu Sans, Arial, sans-serif" font-size="33" font-weight="700" text-anchor="middle" fill="#173658">CRISTALL</text>
<text x="450" y="292" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#173658">Sòlid amb els àtoms, ions</text><text x="450" y="328" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#173658">o molècules ordenats de</text><text x="450" y="364" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#173658">manera periòdica.</text><text x="450" y="400" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#173658">Pot presentar cares planes,</text><text x="450" y="436" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#173658">però no és imprescindible.</text>
<text x="450" y="624" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="600" text-anchor="start" fill="#506577">Pot ser natural o artificial.</text>
<rect x="815" y="180" width="350" height="480" rx="20" fill="#e0ecd9" stroke="#8bac85" stroke-width="2"/>
<text x="990" y="237" font-family="DejaVu Sans, Arial, sans-serif" font-size="33" font-weight="700" text-anchor="middle" fill="#173658">ROCA</text>
<text x="840" y="292" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#173658">Material geològic natural</text><text x="840" y="328" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#173658">format per un o més minerals</text><text x="840" y="364" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#173658">i, de vegades, altres</text><text x="840" y="400" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#173658">components com el vidre</text><text x="840" y="436" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#173658">volcànic.</text>
<text x="840" y="624" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="600" text-anchor="start" fill="#506577">Pot ser monomineràlica.</text>
