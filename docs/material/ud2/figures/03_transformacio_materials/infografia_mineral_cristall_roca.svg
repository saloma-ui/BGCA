<text x="600" y="726" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="middle" fill="#173658">UN EXEMPLE: LA CALCITA (CaCO₃)</text>
<text x="600" y="757" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#506577">Igual composició mineral, però diferents textures i orígens</text>
<rect x="35" y="790" width="350" height="462" rx="20" fill="#f7eadc" stroke="#d3aa78" stroke-width="2"/>
<text x="210" y="847" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="middle" fill="#173658">CRISTALL DE CALCITA</text>
<text x="66" y="897" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#173658">Un únic individu</text><text x="66" y="928" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#173658">cristal·lí amb estructura</text><text x="66" y="959" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#173658">interna contínua.</text>
<rect x="425" y="790" width="350" height="462" rx="20" fill="#edf2df" stroke="#a5bb8d" stroke-width="2"/>
<text x="600" y="847" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="middle" fill="#173658">CALCÀRIA</text>
<text x="456" y="897" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#173658">Roca sedimentària</text><text x="456" y="928" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#173658">formada principalment</text><text x="456" y="959" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#173658">per calcita.</text>
<rect x="815" y="790" width="350" height="462" rx="20" fill="#e2ecf3" stroke="#89adbe" stroke-width="2"/>
<text x="990" y="847" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="middle" fill="#173658">MARBRE</text>
<text x="846" y="897" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#173658">Roca metamòrfica</text><text x="846" y="928" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#173658">de cristalls recristal·litzats</text><text x="846" y="959" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#173658">de calcita o dolomita.</text>
