site_name: BGCA · 1r de Batxillerat
site_description: Materials guia de Biologia, Geologia i Ciències Ambientals
site_url: https://saloma-ui.github.io/BGCA/

theme:
  name: material
  language: ca
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy

plugins:
  - search
  - exporter:
      buttons:
        - title: Baixa el PDF
          icon: material-file-download-outline
          enabled: !!python/name:mkdocs_exporter.formats.pdf.buttons.download.enabled
          attributes: !!python/name:mkdocs_exporter.formats.pdf.buttons.download.attributes
      formats:
        pdf:
          explicit: true
          concurrency: 1
          stylesheets:
            - pdf.scss
          scripts:
            - pdf_mathjax.js
          browser:
            timeout: 120000

hooks:
  - hooks/pdf_material.py

nav:
  - Inici: index.md
  - Material:
      - material/index.md
      - UD01 · Com reconstruïm la història de la Terra?: material/ud1/ud1.md
      - UD02 · Una Terra dinàmica: material/ud2/ud2.md
      - UD03 · Història de la vida i de la biodiversitat: material/ud3/ud3.md
      - UD04 · Microorganismes, salut i malaltia: material/ud4/ud4.md
  - Activitats:
      - activitats/index.md
      - UD01 · Com reconstruïm la història de la Terra?: activitats/ud1/index.md
      - UD02 · Una Terra dinàmica: activitats/ud2/index.md
      - UD03 · Història de la vida i de la biodiversitat: activitats/ud3/index.md
      - UD04 · Microorganismes, salut i malaltia: activitats/ud4/index.md
  - Biblioteca científica: biblioteca/index.md
  - Informació del curs:
      - programacio/index.md
      - Programació: programacio/programacio_didactica_BGCA_1r_batx_2026-2027_v10.md
      - Criteris d'avaluació: programacio/criteris-avaluacio.md
      - Calendari: programacio/calendari.md
  - Sobre aquest web:
      - sobre/index.md
      - Autoria i metodologia: autoria-i-metodologia.md
      - Llicència i reutilització: llicencia.md
      - Crèdits i procedència: registre-recursos.md
      - Inventari visual:
          - Inventari general: inventari-visual.md
          - UD01 · Història de la Terra: registre-figures-ud1.md
          - UD02 · Una Terra dinàmica: registre-figures-ud2.md
          - UD03 · Història de la vida: registre-figures-ud3.md
          - UD04 · Microorganismes: registre-figures-ud4.md
          - Infografies de programació: registre-figures-programacio.md
          # FIGURES_AUTO_INICI

          # FIGURES_AUTO_FI

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - tables
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

extra_css:
  - portada.css
  - programacio/calendari.css
  - presentacio.css
  - a01_ud02.css
  - a01_ud02_classificacio.css
  - a02_ud02.css
  - a03_ud02.css

extra_javascript:
  - interaccio.js
  - a01_ud02_classificacio.js
  - a02_ud02.js
  - mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - a03_ud02.js
