name: Renumerar material UD02

on:
  push:
    paths:
      - '.github/workflows/renumber-ud2.yml'

permissions:
  contents: write

jobs:
  renumber:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Renumerar apartats
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('docs/material/ud2/ud2.md')
          text = path.read_text(encoding='utf-8')

          text = re.sub(
              r'^(## )([0-5])(\. .+)$',
              lambda m: f"{m.group(1)}{int(m.group(2)) + 1}{m.group(3)}",
              text,
              flags=re.MULTILINE,
          )
          text = re.sub(
              r'^(### )([0-5])(\.\d+\. .+)$',
              lambda m: f"{m.group(1)}{int(m.group(2)) + 1}{m.group(3)}",
              text,
              flags=re.MULTILINE,
          )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Comprovar i desar el canvi
        run: |
          if git diff --quiet -- docs/material/ud2/ud2.md; then
            echo "No hi ha canvis per desar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/material/ud2/ud2.md
          git commit -m "Renumerar apartats del material UD02"
          git push
