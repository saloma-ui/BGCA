name: Publica BGCA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Obté el repositori
        uses: actions/checkout@v7

      - name: Configura Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Detecta figures i actualitza els registres
        run: python scripts/actualitza_inventari_figures.py

      - name: Desa les actualitzacions al repositori
        run: |
          git add -- figures/fitxes.json docs/inventari-visual.md docs/registre-figures-*.md docs/sobre/index.md mkdocs.yml
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "docs: actualitza inventari de figures [skip ci]"
            git push origin HEAD:main
          fi

      - name: Instal·la dependències
        run: pip install -r requirements.txt

      - name: Instal·la Chromium per als PDF
        run: python -m playwright install --with-deps chromium

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v6

      - name: Construeix el lloc
        run: mkdocs build

      - name: Comprova els PDF generats
        run: |
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader

          pdfs = sorted(Path('site').rglob('*.pdf'))
          if not pdfs:
              raise SystemExit('No s’ha generat cap PDF.')

          for path in pdfs:
              pages = len(PdfReader(path).pages)
              print(f'{path}: {pages} pàgines')
          PY

      - name: Prepara els fitxers per publicar
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publica a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
